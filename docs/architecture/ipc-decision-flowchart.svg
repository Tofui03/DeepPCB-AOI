<svg viewBox="0 0 1080 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
  <title id="flowchart-title">Decision flow for one detected box</title>
  <desc id="flowchart-desc">Area check first: Open or Short is SCRAP / CRITICAL, and over the pixel-area limit is REWORK / HIGH. The batch count is next. PASS / LOW is only the path with no override. The third count sets halt_production_line.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- Spine. Area check, then batch count, then PASS only if neither area override applied. -->
  <line x1="300" y1="72" x2="300" y2="104" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="158" x2="300" y2="188" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="246" x2="640" y2="246" stroke="#bf4520" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="300" y1="304" x2="300" y2="368" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="422" x2="300" y2="452" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="510" x2="640" y2="510" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="568" x2="300" y2="656" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="714" x2="640" y2="714" stroke="#bf4520" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="300" y1="772" x2="300" y2="836" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge labels sit off the stroke, with room for the full string. -->
  <rect x="468" y="212" width="124" height="22" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="530" y="227" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (SCRAP)</text>

  <rect x="314" y="324" width="44" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="336" y="338" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">NO</text>

  <rect x="456" y="476" width="148" height="22" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="530" y="491" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (&gt; LIMIT)</text>

  <rect x="314" y="600" width="132" height="22" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="380" y="615" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">NO (≤ LIMIT)</text>

  <rect x="446" y="680" width="168" height="22" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="530" y="695" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (count ≥ 3)</text>

  <rect x="314" y="792" width="44" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="336" y="806" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">NO</text>

  <!-- Start -->
  <rect x="190" y="28" width="220" height="44" rx="22" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="300" y="55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Stage 1 Detected BBox</text>

  <!-- Class and area -->
  <rect x="175" y="104" width="250" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="300" y="126" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Extract Polarity &amp; Class</text>
  <text x="300" y="144" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">area_px = (x2-x1) * (y2-y1)</text>

  <!-- Open / Short. YES is a terminal: SCRAP / CRITICAL. -->
  <polygon points="300,188 420,246 300,304 180,246" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="300" y="238" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Is Defect Class</text>
  <text x="300" y="256" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">Open or Short?</text>

  <g transform="translate(640, 210)">
    <rect width="270" height="72" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
    <rect x="8" y="8" width="254" height="16" rx="3" fill="rgba(191,69,32,0.10)"/>
    <text x="135" y="20" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE A: ZERO-TOL</text>
    <text x="135" y="42" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">SCRAP · CRITICAL</text>
    <text x="135" y="58" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Max Allowed: 0 px</text>
  </g>

  <!-- Pixel-area limit. YES is a terminal: REWORK / HIGH. -->
  <rect x="175" y="368" width="250" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="300" y="390" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Look up pixel-area limit</text>
  <text x="300" y="408" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Class 2 / Class 3 max_allowed_px</text>

  <polygon points="300,452 420,510 300,568 180,510" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="300" y="502" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">area_px &gt;</text>
  <text x="300" y="520" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">max_allowed_px?</text>

  <g transform="translate(640, 474)">
    <rect width="270" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/>
    <rect x="8" y="8" width="254" height="16" rx="3" fill="rgba(79,93,117,0.10)"/>
    <text x="135" y="20" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE B: IPC VIOLATION</text>
    <text x="135" y="42" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">REWORK · HIGH</text>
    <text x="135" y="58" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">violates_ipc = True</text>
  </g>

  <!-- Batch count, then the disposition. Halt is a side branch, not a path into PASS. -->
  <polygon points="300,656 420,714 300,772 180,714" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="300" y="706" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Batch Count</text>
  <text x="300" y="724" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">N &gt;= 3?</text>

  <g transform="translate(640, 678)">
    <rect width="270" height="72" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
    <rect x="8" y="8" width="254" height="16" rx="3" fill="rgba(191,69,32,0.15)"/>
    <text x="135" y="20" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE C</text>
    <text x="135" y="42" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">LINE HALT</text>
    <text x="135" y="58" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">sets halt_production_line</text>
  </g>

  <rect x="190" y="836" width="220" height="52" rx="26" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="300" y="858" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">PASS · LOW</text>
  <text x="300" y="874" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Within area limit</text>
</svg>
