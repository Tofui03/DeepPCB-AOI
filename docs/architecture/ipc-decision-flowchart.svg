<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
  <title id="flowchart-title">Decision flow for one detected box</title>
  <desc id="flowchart-desc">Open or Short is SCRAP / CRITICAL. Other classes use a pixel-area limit: over the limit is REWORK / HIGH, within the limit is PASS / LOW. The third count of the same class sets halt_production_line.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- ==================== FLOW CONNECTOR LINES ==================== -->
  <!-- Start -> Step 1 -->
  <line x1="540" y1="68" x2="540" y2="105" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Step 1 -> Diamond 1 -->
  <line x1="540" y1="155" x2="540" y2="190" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1 YES (Open/Short) -> Scrap Branch (Right) -->
  <line x1="650" y1="240" x2="840" y2="240" stroke="#bf4520" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <!-- Scrap -> Drift Check 1 (Down) -->
  <line x1="930" y1="270" x2="930" y2="460" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1 NO (Mousebite, Spur, etc.) -> Step 2 (Down) -->
  <line x1="540" y1="290" x2="540" y2="325" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Step 2 -> Diamond 2 -->
  <line x1="540" y1="375" x2="540" y2="410" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 2 YES (Area > Max) -> Rework Branch (Right) -->
  <line x1="650" y1="460" x2="730" y2="460" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Rework -> Merge into Drift Check (Down) -->
  <line x1="790" y1="490" x2="790" y2="540" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="790" y1="540" x2="600" y2="540" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 2 NO (Area <= Max) -> Pass Branch (Down) -->
  <line x1="540" y1="510" x2="540" y2="580" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Drift Decision Node: Merge from Scrap / Rework to Diamond 3 -->
  <line x1="930" y1="520" x2="930" y2="560" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="930" y1="560" x2="600" y2="560" stroke="#4f5d75" stroke-width="1.5"/>

  <!-- Diamond 3 (Drift >= 3) -> Halt Line (Right) -->
  <line x1="610" y1="650" x2="750" y2="650" stroke="#bf4520" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <!-- Diamond 3 NO -> Standard Dispatch (Down) -->
  <line x1="540" y1="675" x2="540" y2="695" stroke="#4f5d75" stroke-width="1.5"/>

  <!-- ==================== ARROW BADGES / LABELS ==================== -->
  <rect x="710" y="226" width="55" height="18" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="737" y="239" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (SCRAP)</text>

  <rect x="548" y="298" width="40" height="16" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="568" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">NO</text>

  <rect x="662" y="446" width="52" height="18" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="688" y="459" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (&gt; LIMIT)</text>

  <rect x="548" y="528" width="55" height="16" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="575" y="540" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">NO (≤ LIMIT)</text>

  <rect x="640" y="636" width="65" height="18" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)"/>
  <text x="672" y="649" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">YES (DRIFT ≥ 3)</text>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- 1. Start Oval -->
  <rect x="440" y="25" width="200" height="44" rx="22" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="540" y="52" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Stage 1 Detected BBox</text>

  <!-- 2. Step: Class & Geometry Extraction -->
  <rect x="420" y="105" width="240" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="540" y="127" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Extract Polarity &amp; Class</text>
  <text x="540" y="143" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">area_px = (x2-x1) * (y2-y1)</text>

  <!-- 3. Diamond 1: Fatal Class Check -->
  <polygon points="540,190 650,240 540,290 430,240" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="540" y="234" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Is Defect Class</text>
  <text x="540" y="250" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">Open or Short?</text>

  <!-- Node: Forced Scrap (Override A) -->
  <g transform="translate(840, 210)">
    <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
    <rect x="8" y="8" width="164" height="18" rx="3" fill="rgba(191,69,32,0.10)"/>
    <text x="90" y="21" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE A: ZERO-TOL</text>
    <text x="90" y="40" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">SCRAP · CRITICAL</text>
    <text x="90" y="53" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Max Allowed: 0 px</text>
  </g>

  <!-- 4. Step 2: Spec Lookup -->
  <rect x="420" y="325" width="240" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="540" y="346" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Look up pixel-area limit</text>
  <text x="540" y="362" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Class 2 / Class 3 max_allowed_px</text>

  <!-- 5. Diamond 2: Area Limit Comparison -->
  <polygon points="540,410 650,460 540,510 430,460" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="540" y="454" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">area_px &gt;</text>
  <text x="540" y="470" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">max_allowed_px?</text>

  <!-- Node: Rework Decision (Override B) -->
  <g transform="translate(730, 430)">
    <rect width="160" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/>
    <rect x="8" y="8" width="144" height="18" rx="3" fill="rgba(79,93,117,0.10)"/>
    <text x="80" y="21" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE B: IPC VIOLATION</text>
    <text x="80" y="40" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">REWORK · HIGH</text>
    <text x="80" y="53" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">violates_ipc = True</text>
  </g>

  <!-- Node: Pass Decision (Happy Path) -->
  <g transform="translate(440, 580)">
    <rect width="200" height="44" rx="22" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="100" y="26" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">PASS · LOW</text>
    <text x="100" y="38" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Within area limit</text>
  </g>

  <!-- 6. Diamond 3: Batch Drift Check -->
  <polygon points="540,620 620,650 540,680 460,650" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="540" y="646" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Batch Count</text>
  <text x="540" y="659" fill="#bf4520" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">N &gt;= 3?</text>

  <!-- Node: Emergency Line Halt (Override C) -->
  <g transform="translate(750, 620)">
    <rect width="200" height="60" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
    <rect x="8" y="8" width="184" height="18" rx="3" fill="rgba(191,69,32,0.15)"/>
    <text x="100" y="21" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">OVERRIDE C: LINE HALT</text>
    <text x="100" y="41" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">halt_production_line</text>
    <text x="100" y="54" fill="#5a6580" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">sets halt_production_line</text>
  </g>
</svg>