<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stage1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fastpath-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="halt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Canvas Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">DeepPCB-AOI • Industrial Edge-Vision Architecture</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">Hybrid 4-Stage Optical Inspection Pipeline: Deterministic ONNX Difference Engine &amp; Guardrailed Semantic Triage</text>
    <rect x="920" y="-18" width="240" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="938" cy="0" r="5" fill="#10b981"/>
    <text x="952" y="5" fill="#cbd5e1" font-size="12" font-weight="600">IPC-A-600 CLASS 2 / 3</text>
  </g>

  <!-- ==================== STAGE 0: INPUTS ==================== -->
  <g transform="translate(60, 120)">
    <rect width="170" height="380" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#card-glow)"/>
    <rect x="16" y="16" width="138" height="24" rx="6" fill="#0f172a"/>
    <text x="85" y="32" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">INPUT PAIR (640×640)</text>

    <!-- Template Box -->
    <rect x="18" y="55" width="134" height="135" rx="8" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <rect x="26" y="63" width="118" height="20" rx="4" fill="#1e293b"/>
    <text x="85" y="77" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">GOLDEN TEMPLATE</text>
    <path d="M 32 110 H 138 M 32 135 H 138 M 32 160 H 138" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="110" r="6" fill="#eab308"/>
    <circle cx="110" cy="160" r="6" fill="#eab308"/>

    <!-- Tested PCB Box -->
    <rect x="18" y="215" width="134" height="135" rx="8" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <rect x="26" y="223" width="118" height="20" rx="4" fill="#1e293b"/>
    <text x="85" y="237" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">TEST PCB (W/ DEFECTS)</text>
    <path d="M 32 270 H 138 M 32 295 H 138 M 32 320 H 138" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="270" r="6" fill="#eab308"/>
    <!-- Simulated Short defect -->
    <rect x="65" y="270" width="8" height="25" fill="#ef4444"/>
    <circle cx="110" cy="320" r="6" fill="#eab308"/>
  </g>

  <!-- Arrow Input -> Stage 1 -->
  <path d="M 230 310 L 268 310" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- ==================== STAGE 1: ONNX EDGE VISION ==================== -->
  <g transform="translate(275, 120)">
    <rect width="280" height="380" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#card-glow)"/>
    
    <!-- Stage Header Badge -->
    <rect x="16" y="16" width="248" height="26" rx="6" fill="#0369a1"/>
    <text x="140" y="33" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">STAGE 1: DETERMINISTIC ONNX VISION</text>
    
    <!-- Metrics Pill -->
    <rect x="16" y="50" width="248" height="22" rx="4" fill="#0c4a6e"/>
    <text x="140" y="65" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">SLA: mean under 15 ms (Stage 1 detect)</text>

    <!-- Inner Modules -->
    <g transform="translate(16, 85)">
      <!-- 1. Diff Graph -->
      <rect width="248" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700">696-Byte Handcrafted ONNX Graph</text>
      <text x="14" y="40" fill="#94a3b8" font-size="11">• Sub, Abs, then Conv 4×4 stride 4</text>
      <text x="14" y="54" fill="#94a3b8" font-size="11">• Zero-Dependency Protobuf Varint Synthesis</text>

      <!-- 2. Morphology Analysis -->
      <rect y="75" width="248" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="97" fill="#f8fafc" font-size="12" font-weight="700">Morphological Polarity Classifier</text>
      <text x="14" y="115" fill="#94a3b8" font-size="11">• Sign(Tpl - Tst): Missing vs Extra Copper</text>
      <text x="14" y="129" fill="#94a3b8" font-size="11">• Six classes, incl. Pin-hole / Spurious Cu</text>

      <!-- 3. NMS Filter -->
      <rect y="150" width="248" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="172" fill="#f8fafc" font-size="12" font-weight="700">NMS Bounding Box Extraction</text>
      <text x="14" y="190" fill="#94a3b8" font-size="11">• Suppress when IoU ≥ 0.45 (inside detect)</text>
    </g>

    <!-- FastPath Split Branch -->
    <rect x="16" y="310" width="248" height="52" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <text x="140" y="330" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">FAST-PATH BYPASS GATE</text>
    <text x="140" y="348" fill="#a7f3d0" font-size="11" text-anchor="middle">Detections == 0 ? ➔ PASS, 0 VLM tokens</text>
  </g>

  <!-- ==================== FASTPATH HIGHWAY ==================== -->
  <path d="M 400 482 L 400 560 L 980 560" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <rect x="570" y="544" width="230" height="28" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="685" y="562" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">⚡ ZERO-TOKEN BYPASS: PASS (no VLM call)</text>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <path d="M 555 220 L 595 220" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <!-- ==================== STAGE 2: GROUND-TRUTH RULES ==================== -->
  <g transform="translate(605, 120)">
    <rect width="200" height="380" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="2" filter="url(#card-glow)"/>
    
    <rect x="14" y="16" width="172" height="26" rx="6" fill="#b45309"/>
    <text x="100" y="33" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">STAGE 2: DETERMINISTIC TOOLS</text>
    
    <g transform="translate(14, 60)">
      <!-- IPC Rule Engine -->
      <rect width="172" height="125" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#fbbf24" font-size="12" font-weight="700">IPC-A-600 area rules</text>
      <text x="12" y="38" fill="#94a3b8" font-size="11">Stand-in Area Limits:</text>
      <text x="12" y="56" fill="#f8fafc" font-size="11">• Open / Short: 0 px</text>
      <text x="12" y="72" fill="#f8fafc" font-size="11">• Mousebite: 250 / 120 px</text>
      <text x="12" y="88" fill="#f8fafc" font-size="11">• Spur: 200 / 100 px</text>
      <text x="12" y="104" fill="#f8fafc" font-size="11">• Pin-hole: 160 / 75 px</text>

      <!-- SQLite Batch Store -->
      <rect y="140" width="172" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="162" fill="#38bdf8" font-size="12" font-weight="700">SQLite Telemetry</text>
      <text x="12" y="180" fill="#94a3b8" font-size="11">Batch Drift Tracking:</text>
      <text x="12" y="200" fill="#f8fafc" font-size="11">• Defect Frequencies</text>
      <text x="12" y="218" fill="#f8fafc" font-size="11">• Batch ID Isolation</text>
      <text x="12" y="236" fill="#ef4444" font-size="11" font-weight="700">• Threshold: N &gt;= 3</text>
      <text x="12" y="254" fill="#fca5a5" font-size="10">(Trips Line Halt Alarm)</text>
    </g>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <path d="M 805 220 L 845 220" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>

  <!-- ==================== STAGE 3: BOUNDED VLM TRIAGE ==================== -->
  <g transform="translate(855, 120)">
    <rect width="175" height="380" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#card-glow)"/>
    
    <rect x="12" y="16" width="151" height="26" rx="6" fill="#6d28d9"/>
    <text x="87" y="33" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">STAGE 3: BOUNDED VLM</text>

    <g transform="translate(12, 60)">
      <!-- ROI Cropping -->
      <rect width="151" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#c084fc" font-size="11" font-weight="700">Defect ROI Cropping</text>
      <text x="10" y="38" fill="#94a3b8" font-size="10">• Padding = 32px Clamped</text>
      <text x="10" y="52" fill="#94a3b8" font-size="10">• Target Patch Only</text>

      <!-- VLM Callable -->
      <rect y="78" width="151" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="98" fill="#c084fc" font-size="11" font-weight="700">VLM Semantic Triage</text>
      <text x="10" y="116" fill="#94a3b8" font-size="10">• Root Cause Analysis</text>
      <text x="10" y="132" fill="#94a3b8" font-size="10">• Corrective Action</text>
      <text x="10" y="150" fill="#fbbf24" font-size="10" font-weight="700">• Max Retries: 2</text>
      <text x="10" y="166" fill="#94a3b8" font-size="10">• Strict Pydantic Eval</text>
      <text x="10" y="182" fill="#34d399" font-size="10">• Fallback: Rule Engine</text>

      <!-- Untrusted Box -->
      <rect y="210" width="151" height="85" rx="8" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
      <text x="10" y="230" fill="#e9d5ff" font-size="10" font-weight="700">AI Proposes Verdict</text>
      <text x="10" y="248" fill="#ddd6fe" font-size="10">Output is treated as</text>
      <text x="10" y="264" fill="#f43f5e" font-size="10" font-weight="700">UNTRUSTED PROPOSAL</text>
      <text x="10" y="280" fill="#ddd6fe" font-size="10">Subject to Stage 4 veto</text>
    </g>
  </g>

  <!-- Arrow Stage 3 -> Stage 4 -->
  <path d="M 1030 220 L 1065 220" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-rose)"/>

  <!-- ==================== STAGE 4: PYTHON GUARDRAILS ==================== -->
  <g transform="translate(1075, 120)">
    <rect width="150" height="380" rx="12" fill="#1e293b" stroke="#e11d48" stroke-width="2" filter="url(#card-glow)"/>
    
    <rect x="10" y="16" width="130" height="26" rx="6" fill="#be123c"/>
    <text x="75" y="33" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.5">STAGE 4: GUARDRAILS</text>

    <g transform="translate(10, 60)">
      <!-- Override A -->
      <rect width="130" height="80" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="8" y="18" fill="#fda4af" font-size="10" font-weight="800">OVERRIDE A: 0-TOL</text>
      <text x="8" y="34" fill="#fecdd3" font-size="10">Open / Short:</text>
      <text x="8" y="50" fill="#ffffff" font-size="10" font-weight="800">➔ SCRAP</text>
      <text x="8" y="66" fill="#ffffff" font-size="10" font-weight="800">➔ CRITICAL</text>

      <!-- Override B -->
      <rect y="90" width="130" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="8" y="108" fill="#fbbf24" font-size="10" font-weight="800">OVERRIDE B: IPC</text>
      <text x="8" y="124" fill="#94a3b8" font-size="10">Area &gt; Limit:</text>
      <text x="8" y="140" fill="#f8fafc" font-size="10">• Cannot PASS</text>
      <text x="8" y="156" fill="#f8fafc" font-size="10">• Floor: HIGH / REWORK</text>

      <!-- Override C -->
      <rect y="185" width="130" height="110" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="204" fill="#fca5a5" font-size="10" font-weight="800">OVERRIDE C: DRIFT</text>
      <text x="8" y="220" fill="#fecaca" font-size="10">Count &gt;= 3 in batch:</text>
      <text x="8" y="238" fill="#ef4444" font-size="10" font-weight="800">➔ LINE HALT</text>
      <text x="8" y="254" fill="#fca5a5" font-size="9">Overrules All Models</text>
      <text x="8" y="270" fill="#fca5a5" font-size="9">halt_production_line flag</text>
    </g>
  </g>

  <!-- ==================== FINAL ACTUATION OUTPUTS ==================== -->
  <g transform="translate(480, 620)">
    <rect width="745" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#card-glow)"/>
    
    <text x="24" y="32" fill="#f8fafc" font-size="14" font-weight="800">OPERATOR CONSOLE</text>
    <text x="24" y="50" fill="#94a3b8" font-size="12">Web console at / : disposition, audit JSON, and the line-halt flag</text>

    <!-- Console Badge -->
    <g transform="translate(24, 70)">
      <rect width="280" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="24" cy="30" r="10" fill="#0284c7"/>
      <text x="24" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">HUD</text>
      <text x="46" y="26" fill="#f8fafc" font-size="12" font-weight="700">AOI Web Console (/)</text>
      <text x="46" y="44" fill="#94a3b8" font-size="11">Dual Canvas Reticle &amp; Audit Trail JSON</text>
    </g>

    <!-- Normal Dispositions -->
    <g transform="translate(320, 70)">
      <rect width="170" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="26" fill="#34d399" font-size="12" font-weight="800">BOARD DISPOSITION</text>
      <text x="16" y="46" fill="#e2e8f0" font-size="12">PASS · REWORK · SCRAP</text>
    </g>

    <!-- Console line-halt banner -->
    <g transform="translate(506, 70)">
      <rect width="215" height="60" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="10" fill="#dc2626"/>
      <text x="24" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">!</text>
      <text x="44" y="25" fill="#fca5a5" font-size="11" font-weight="800">EMERGENCY LINE HALT</text>
      <text x="44" y="45" fill="#fecaca" font-size="10">Raises the console halt banner</text>
    </g>
  </g>

  <!-- Flow Connector from Stage 4 to Output -->
  <path d="M 1150 500 L 1150 620" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-rose)"/>
</svg>